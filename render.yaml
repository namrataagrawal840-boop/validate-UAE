# One-click deploy on Render: New > Blueprint > pick this repository.
services:
  - type: web
    name: validate-uae
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # Render asks you to paste it; it is never stored in the code
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: SIM_MODE
        value: fast          # the free plan has little CPU
      - key: WEB_SEARCH_TOOL
        value: web_search_20250305
      - key: SECRET_KEY
        generateValue: true  # signs login tokens; generated by Render, never in the code
      - key: DATABASE_URL
        sync: false          # optional: a PostgreSQL URL so accounts and projects survive restarts
